# The Windows build: one portable package with the app and its CLI helper, and nothing else
# heavy. The ZCode agent is deliberately NOT in the package — it is not ours to ship — and the
# sandbox fetches what it needs itself:
#   • a sandbox from the ZCode template (e2b-template/ in this repository) already carries the
#     agent, Node 22 and every tool;
#   • any other sandbox downloads the agent bundle and the Linux CLI helper at setup, straight
#     into the box, from the releases that point at them (see crates/ai/src/sandbox.rs).
# That keeps the download small (no Node runtime, no agent bundle inside) and the agent off
# people's disks: it only ever runs inside the sandbox, or from a folder its owner points
# Settings → AI at.
#
# The upstream release pipeline (WiX MSI, signing, every platform) lives in a private reusable
# workflow this fork can't call; this one is self-contained and produces the Windows exe.

name: Windows build

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_INCREMENTAL: 0

jobs:
  linux-cli:
    name: Linux CLI helper (for the sandbox)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - name: Install musl tools (retry + mirror fallback)
        shell: bash
        run: |
          if command -v musl-gcc >/dev/null 2>&1; then
            echo "musl-gcc already present; skipping apt install."
            exit 0
          fi

          sudo tee /etc/apt/apt.conf.d/99-ci-retries >/dev/null <<'EOF'
          Acquire::Retries "6";
          Acquire::http::Timeout "30";
          Acquire::https::Timeout "30";
          Acquire::ForceIPv4 "true";
          EOF

          sudo apt-get update || true

          for attempt in 1 2 3; do
            if sudo apt-get install -y --no-install-recommends --fix-missing musl-tools; then
              command -v musl-gcc >/dev/null 2>&1
              exit 0
            fi
            echo "musl-tools install attempt ${attempt} failed."
            if [[ "${attempt}" == "1" && -f /etc/apt/sources.list.d/ubuntu.sources ]]; then
              echo "Switching ubuntu.sources away from apt mirrorlist to archive.ubuntu.com"
              sudo sed -i 's|URIs: mirror+file:/etc/apt/apt-mirrors.txt|URIs: http://archive.ubuntu.com/ubuntu|g' /etc/apt/sources.list.d/ubuntu.sources
            fi
            sleep $((attempt * 15))
            sudo apt-get update || true
          done

          echo "Unable to install musl-tools after retries."
          exit 1
      - uses: Swatinem/rust-cache@v2
        with:
          key: linux-cli-musl
          cache-on-failure: true
      - name: Build the CLI (static)
        run: cargo build --release -p craft-anything-cli --target x86_64-unknown-linux-musl
      # The artifact keeps its own file name: an upload-artifact zip holds the file path inside the
      # given path, so uploading `.../release/craft-anything-cli` downloads back as
      # `craft-anything-cli`, not `craft-anything-cli-linux` (the artifact *name* never becomes the
      # file's name). Stage it under the name the app looks for — `<exe>/resources/sandbox/
      # craft-anything-cli-linux` (crates/ai/src/sandbox.rs, `sandbox_cli_path`) — before uploading.
      - name: Stage the CLI under the name the app looks for
        run: |
          mkdir -p resources/sandbox
          cp target/x86_64-unknown-linux-musl/release/craft-anything-cli resources/sandbox/craft-anything-cli-linux
          file resources/sandbox/craft-anything-cli-linux || true
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: craft-anything-cli-linux
          path: resources/sandbox/craft-anything-cli-linux
          if-no-files-found: error

  windows:
    name: Windows exe
    runs-on: windows-latest
    needs: linux-cli
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: windows-exe
          cache-on-failure: true

      - name: Build the app and its CLI helper
        run: cargo build --release -p craft-anything -p craft-anything-cli

      # The artifact's name is not the file's name: upload-artifact zips the file under the path
      # inside the uploaded folder, so this downloads back as `craft-anything-cli-linux` only
      # because the Linux job stages it under that name. Downloading into its own folder keeps the
      # next step's copy unambiguous, and the checks below name what went wrong if it ever isn't.
      - name: Take the sandbox's Linux CLI
        uses: actions/download-artifact@v4
        with:
          name: craft-anything-cli-linux
          path: ${{ runner.temp }}/sandbox-cli

      - name: Check the sandbox's Linux CLI
        shell: pwsh
        run: |
          $dir = "$env:RUNNER_TEMP/sandbox-cli"
          Get-ChildItem $dir -Recurse -File | ForEach-Object { Write-Host "$($_.Length)`t$($_.FullName)" }
          $cli = Get-ChildItem $dir -Recurse -File -Filter 'craft-anything-cli*' | Select-Object -First 1
          if (-not $cli) { throw "The craft-anything-cli-linux artifact holds no craft-anything-cli file" }
          # An ELF x86-64 binary: it is uploaded to the Linux sandbox, so a Windows exe here would
          # be a silently broken sandbox later on.
          $fs = [System.IO.File]::OpenRead($cli.FullName)
          try {
            $magic = New-Object byte[] 5
            $null = $fs.Read($magic, 0, 5)
          } finally { $fs.Dispose() }
          if ($magic[0] -ne 0x7F -or $magic[1] -ne 0x45 -or $magic[2] -ne 0x4C -or $magic[3] -ne 0x46) {
            throw "$($cli.FullName) is not a Linux (ELF) binary"
          }
          if ($magic[4] -ne 2) { throw "$($cli.FullName) is ELF class $($magic[4]): expected 64-bit (2)" }
          New-Item -ItemType Directory -Force -Path resources/sandbox | Out-Null
          Copy-Item $cli.FullName resources/sandbox/craft-anything-cli-linux -Force
          Write-Host "sandbox CLI: $($cli.Length) bytes"

      # The package: the app and its CLI helper for this computer. The Linux helper travels to the
      # sandbox at setup (a template carries it, or the sandbox fetches it from this repository's
      # release), so it is not in the zip: one CLI per computer, no duplicate inside the package.
      - name: Package the portable app
        shell: pwsh
        run: |
          $stage = "$env:RUNNER_TEMP/craft-anything"
          if (Test-Path $stage) { Remove-Item $stage -Recurse -Force }
          New-Item -ItemType Directory -Force -Path "$stage/resources" | Out-Null
          foreach ($exe in 'craft-anything.exe', 'craft-anything-cli.exe') {
            if (-not (Test-Path "target/release/$exe")) { throw "target/release/$exe is missing: the build above didn't produce it" }
            Copy-Item "target/release/$exe" $stage/
          }
          # The app finds the CLI beside itself; check the package, not the checkout, so a layout
          # mistake fails here rather than on someone's desktop.
          $expected = @(
            'craft-anything.exe',
            'craft-anything-cli.exe'
          )
          foreach ($rel in $expected) {
            if (-not (Test-Path (Join-Path $stage $rel))) { throw "the package is missing $rel" }
          }
          $zip = "$env:RUNNER_TEMP/craft-anything-windows-x64.zip"
          if (Test-Path $zip) { Remove-Item $zip }
          Compress-Archive -Path "$stage/*" -DestinationPath $zip
          Move-Item $zip craft-anything-windows-x64.zip -Force
          Move-Item resources/sandbox/craft-anything-cli-linux craft-anything-cli-linux -Force
          Get-Item craft-anything-windows-x64.zip, craft-anything-cli-linux | ForEach-Object { Write-Host "$($_.Name): $($_.Length) bytes" }

      - name: Upload the package
        uses: actions/upload-artifact@v4
        with:
          name: craft-anything-windows-x64
          path: craft-anything-windows-x64.zip
          if-no-files-found: error

      - name: Release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            craft-anything-windows-x64.zip
            craft-anything-cli-linux
