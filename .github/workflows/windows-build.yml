# The Windows build: one portable package with the app, the CLI helper next to it, and the
# bundled ZCode agent (its runtime and search tools are fetched at build time, so this
# repository stays light — see resources/zcode/README.md). A Linux build of the CLI helper
# comes along too, for the sandbox's tool server.
#
# The upstream release pipeline (WiX MSI, signing, every platform) lives in a private reusable
# workflow this fork can't call; this one is self-contained and produces the Windows exe.

name: Windows build

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_INCREMENTAL: 0
  NODE_VERSION: 22.20.0
  RG_VERSION: 14.1.1
  UGREP_VERSION: v7.8.5
  ZCODE_APP_CLI_VERSION: 3.17.2-45

jobs:
  linux-cli:
    name: Linux CLI helper (for the sandbox)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - name: Install musl tools (retry + mirror fallback)
        shell: bash
        run: |
          if command -v musl-gcc >/dev/null 2>&1; then
            echo "musl-gcc already present; skipping apt install."
            exit 0
          fi

          sudo tee /etc/apt/apt.conf.d/99-ci-retries >/dev/null <<'EOF'
          Acquire::Retries "6";
          Acquire::http::Timeout "30";
          Acquire::https::Timeout "30";
          Acquire::ForceIPv4 "true";
          EOF

          sudo apt-get update || true

          for attempt in 1 2 3; do
            if sudo apt-get install -y --no-install-recommends --fix-missing musl-tools; then
              command -v musl-gcc >/dev/null 2>&1
              exit 0
            fi
            echo "musl-tools install attempt ${attempt} failed."
            if [[ "${attempt}" == "1" && -f /etc/apt/sources.list.d/ubuntu.sources ]]; then
              echo "Switching ubuntu.sources away from apt mirrorlist to archive.ubuntu.com"
              sudo sed -i 's|URIs: mirror+file:/etc/apt/apt-mirrors.txt|URIs: http://archive.ubuntu.com/ubuntu|g' /etc/apt/sources.list.d/ubuntu.sources
            fi
            sleep $((attempt * 15))
            sudo apt-get update || true
          done

          echo "Unable to install musl-tools after retries."
          exit 1
      - uses: Swatinem/rust-cache@v2
        with:
          key: linux-cli-musl
          cache-on-failure: true
      - name: Build the CLI (static)
        run: cargo build --release -p craft-anything-cli --target x86_64-unknown-linux-musl
      # The artifact keeps its own file name: an upload-artifact zip holds the file path inside the
      # given path, so uploading `.../release/craft-anything-cli` downloads back as
      # `craft-anything-cli`, not `craft-anything-cli-linux` (the artifact *name* never becomes the
      # file's name). Stage it under the name the app looks for — `<exe>/resources/sandbox/
      # craft-anything-cli-linux` (crates/ai/src/sandbox.rs, `sandbox_cli_path`) — before uploading.
      - name: Stage the CLI under the name the app looks for
        run: |
          mkdir -p resources/sandbox
          cp target/x86_64-unknown-linux-musl/release/craft-anything-cli resources/sandbox/craft-anything-cli-linux
          file resources/sandbox/craft-anything-cli-linux || true
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: craft-anything-cli-linux
          path: resources/sandbox/craft-anything-cli-linux
          if-no-files-found: error

  windows:
    name: Windows exe
    runs-on: windows-latest
    needs: linux-cli
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: windows-exe
          cache-on-failure: true
      - name: Cache Windows packaging downloads
        uses: actions/cache@v4
        with:
          key: windows-packaging-${{ env.NODE_VERSION }}-${{ env.RG_VERSION }}-${{ env.UGREP_VERSION }}-${{ env.ZCODE_APP_CLI_VERSION }}
          path: .cache/windows-build

      - name: Build the app and its CLI helper
        run: cargo build --release -p craft-anything -p craft-anything-cli

      - name: Fetch the ZCode agent
        shell: pwsh
        run: |
          $cache = ".cache/windows-build"
          New-Item -ItemType Directory -Force -Path $cache | Out-Null
          New-Item -ItemType Directory -Force -Path resources/zcode/node, resources/zcode/resources | Out-Null
          $cachedZcode = "$cache/zcode-$env:ZCODE_APP_CLI_VERSION.cjs"
          if (-not (Test-Path $cachedZcode)) {
            $meta = Invoke-RestMethod -Uri "https://registry.npmjs.org/zcode-app-cli/$env:ZCODE_APP_CLI_VERSION"
            $tgz = "$env:RUNNER_TEMP/zcode-app-cli.tgz"
            $extract = "$env:RUNNER_TEMP/zcode-app-cli"
            if (Test-Path $extract) { Remove-Item $extract -Recurse -Force }
            New-Item -ItemType Directory -Force -Path $extract | Out-Null
            Invoke-WebRequest -Uri $meta.dist.tarball -OutFile $tgz
            tar -xzf $tgz -C $extract
            Copy-Item "$extract/package/vendor/zcode.cjs" $cachedZcode -Force
          }
          Copy-Item $cachedZcode resources/zcode/zcode.cjs -Force
          $zcode = (Get-Item resources/zcode/zcode.cjs).Length
          if ($zcode -lt 1000000) { throw "zcode.cjs looks wrong ($zcode bytes)" }
          Write-Host "zcode.cjs: $zcode bytes"

      - name: Fetch the Node 22 runtime
        shell: pwsh
        run: |
          $cache = ".cache/windows-build"
          $zip = "$cache/node-v${env:NODE_VERSION}-win-x64.zip"
          $extract = "$cache/node-v${env:NODE_VERSION}-win-x64"
          if (-not (Test-Path "$extract/node.exe")) {
            Invoke-WebRequest -Uri "https://nodejs.org/dist/v${env:NODE_VERSION}/node-v${env:NODE_VERSION}-win-x64.zip" -OutFile $zip
            Expand-Archive -Path $zip -DestinationPath $cache -Force
          }
          Copy-Item "$extract/node.exe" resources/zcode/node/node.exe -Force
          & resources/zcode/node/node.exe --version

      - name: Fetch the agent's search tools
        shell: pwsh
        run: |
          $cache = ".cache/windows-build"
          $rgZip = "$cache/ripgrep-${env:RG_VERSION}.zip"
          $rgExtract = "$cache/ripgrep-${env:RG_VERSION}"
          if (-not (Test-Path "$rgExtract/ripgrep-${env:RG_VERSION}-x86_64-pc-windows-msvc/rg.exe")) {
            Invoke-WebRequest -Uri "https://github.com/BurntSushi/ripgrep/releases/download/${env:RG_VERSION}/ripgrep-${env:RG_VERSION}-x86_64-pc-windows-msvc.zip" -OutFile $rgZip
            Expand-Archive -Path $rgZip -DestinationPath $rgExtract -Force
          }
          Copy-Item "$rgExtract/ripgrep-${env:RG_VERSION}-x86_64-pc-windows-msvc/rg.exe" resources/zcode/resources/rg.exe -Force

          # The agent looks these up by name (rg.exe, ugrep.exe) in its resources folder, so a
          # bundle missing one is a broken builder. ugrep's release zip also nests its exe in a
          # folder whose name has changed between versions: find it rather than hard-coding it.
          $ugZip = "$cache/ugrep-${env:UGREP_VERSION}.zip"
          $ugExtract = "$cache/ugrep-${env:UGREP_VERSION}"
          if (-not (Get-ChildItem $ugExtract -Recurse -Filter 'ugrep.exe' -ErrorAction SilentlyContinue)) {
            Invoke-WebRequest -Uri "https://github.com/Genivia/ugrep/releases/download/${env:UGREP_VERSION}/ugrep-windows-x64.zip" -OutFile $ugZip
            Expand-Archive -Path $ugZip -DestinationPath $ugExtract -Force
          }
          $ugrep = Get-ChildItem $ugExtract -Recurse -Filter 'ugrep.exe' | Select-Object -First 1
          if (-not $ugrep) { throw "ugrep-windows-x64.zip (${env:UGREP_VERSION}) holds no ugrep.exe" }
          Copy-Item $ugrep.FullName resources/zcode/resources/ugrep.exe -Force
          foreach ($tool in 'rg.exe', 'ugrep.exe') {
            $path = "resources/zcode/resources/$tool"
            if (-not (Test-Path $path)) { throw "$path is missing after fetching the search tools" }
          }
          Get-ChildItem resources/zcode -Recurse -File | ForEach-Object { Write-Host "$($_.Length)`t$($_.FullName)" }

      # The artifact's name is not the file's name: upload-artifact zips the file under the path
      # inside the uploaded folder, so this downloads back as `craft-anything-cli-linux` only
      # because the Linux job stages it under that name. Downloading into its own folder keeps the
      # next step's copy unambiguous, and the checks below name what went wrong if it ever isn't.
      - name: Take the sandbox's Linux CLI
        uses: actions/download-artifact@v4
        with:
          name: craft-anything-cli-linux
          path: ${{ runner.temp }}/sandbox-cli

      - name: Check the sandbox's Linux CLI
        shell: pwsh
        run: |
          $dir = "$env:RUNNER_TEMP/sandbox-cli"
          Get-ChildItem $dir -Recurse -File | ForEach-Object { Write-Host "$($_.Length)`t$($_.FullName)" }
          $cli = Get-ChildItem $dir -Recurse -File -Filter 'craft-anything-cli*' | Select-Object -First 1
          if (-not $cli) { throw "The craft-anything-cli-linux artifact holds no craft-anything-cli file" }
          # An ELF x86-64 binary: it is uploaded to the Linux sandbox, so a Windows exe here would
          # be a silently broken sandbox later on.
          $fs = [System.IO.File]::OpenRead($cli.FullName)
          try {
            $magic = New-Object byte[] 5
            $null = $fs.Read($magic, 0, 5)
          } finally { $fs.Dispose() }
          if ($magic[0] -ne 0x7F -or $magic[1] -ne 0x45 -or $magic[2] -ne 0x4C -or $magic[3] -ne 0x46) {
            throw "$($cli.FullName) is not a Linux (ELF) binary"
          }
          if ($magic[4] -ne 2) { throw "$($cli.FullName) is ELF class $($magic[4]): expected 64-bit (2)" }
          New-Item -ItemType Directory -Force -Path resources/sandbox | Out-Null
          Copy-Item $cli.FullName resources/sandbox/craft-anything-cli-linux -Force
          Write-Host "sandbox CLI: $($cli.Length) bytes"

      - name: Package the portable app
        shell: pwsh
        run: |
          $stage = "$env:RUNNER_TEMP/craft-anything"
          if (Test-Path $stage) { Remove-Item $stage -Recurse -Force }
          New-Item -ItemType Directory -Force -Path "$stage/resources", "$stage/resources/sandbox" | Out-Null
          foreach ($exe in 'craft-anything.exe', 'craft-anything-cli.exe') {
            if (-not (Test-Path "target/release/$exe")) { throw "target/release/$exe is missing: the build above didn't produce it" }
            Copy-Item "target/release/$exe" $stage/
          }
          # The whole folder (dotfiles included), so nothing the agent needs is left behind.
          Copy-Item resources/zcode $stage/resources -Recurse
          Copy-Item resources/sandbox/craft-anything-cli-linux $stage/resources/sandbox/craft-anything-cli-linux -Force
          # The app finds the CLI beside itself (resources/sandbox/), and the agent finds zcode.cjs,
          # its node.exe and its search tools inside resources/zcode/ — check the package, not the
          # checkout, so a layout mistake fails here rather than on someone's desktop.
          $expected = @(
            'resources/sandbox/craft-anything-cli-linux',
            'resources/zcode/zcode.cjs',
            'resources/zcode/node/node.exe',
            'resources/zcode/resources/rg.exe',
            'resources/zcode/resources/ugrep.exe'
          )
          foreach ($rel in $expected) {
            if (-not (Test-Path (Join-Path $stage $rel))) { throw "the package is missing $rel" }
          }
          $zip = "$env:RUNNER_TEMP/craft-anything-windows-x64.zip"
          if (Test-Path $zip) { Remove-Item $zip }
          Compress-Archive -Path "$stage/*" -DestinationPath $zip
          Move-Item $zip craft-anything-windows-x64.zip -Force
          Get-Item craft-anything-windows-x64.zip | ForEach-Object { Write-Host "package: $($_.Length) bytes" }

      - name: Upload the package
        uses: actions/upload-artifact@v4
        with:
          name: craft-anything-windows-x64
          path: craft-anything-windows-x64.zip
          if-no-files-found: error

      - name: Release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: craft-anything-windows-x64.zip
