name: CI

# Quality gates for every push to main and every pull request: fmt, the workspace checks, the
# lints, the tests, and the workspace's own `cargo xtask` audits. (Upstream runs the same suite
# through a private reusable workflow in craft-common-actions; this fork runs it here directly.)
on:
  push:
    branches: [main, "feature/**", "feat/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a PR branch cancels its older run; every push to main runs to the end.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gate:
    name: fmt, clippy, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install the desktop's Linux libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev libgl1-mesa-dev libgtk-3-dev
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Layers
        run: cargo xtask layers
      - name: Locks
        run: cargo xtask locks
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --workspace
      - name: The CLI helper (two of the AI crate's tests start it)
        run: cargo build -p craft-anything-cli
