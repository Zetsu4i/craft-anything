name: SonarCloud

# NOTE (fork): this workflow calls a reusable workflow in storytold/craft-common-actions,
# which this fork cannot invoke. It stays here for future merges and runs only by hand.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sonarcloud-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  sonarcloud:
    uses: storytold/craft-common-actions/.github/workflows/sonarcloud.yml@main
    secrets: inherit
